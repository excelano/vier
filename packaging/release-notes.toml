# What this release tells the App Store it changed. The version is checked
# against the release being cut, so notes left from last time stop the release
# rather than reaching the listing.

version = "1.2.0"

[locales."en-us"]
whats-new = """
Vier now plays on iPhone and iPad as well as Apple Watch: slide to aim and swipe down to drop, as on the watch. On an iPad the board fills the screen, upright or turned, and two players can share it across a table. The watch app still plays on its own.
"""
