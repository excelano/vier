# The copy the App Store listing is filled in from. Every line is a claim about
# the code, so it lives here, is reviewed and committed like anything else, and
# ship-appstore pushes it on every release. Edit here; do not edit the listing
# in a browser.
#
# Limits, counted in characters: apple.name and apple.subtitle 30,
# apple.promotional-text 170, apple.keywords 100 including the commas,
# description 4,000, apple-review-notes 4,000.

apple-review-notes = """
Vier is a four-in-a-row game for iPhone, with an Apple Watch app included that also runs without the iPhone. No login is needed, and neither app makes a network connection. The two apps share no data; each keeps its own game.

PLAYING ON IPHONE
1. Launch Vier. Players starts as Against the iPhone; tap Play.
2. Slide a finger sideways on the board to move the red disc above it from column to column.
3. Swipe down on the board to drop the disc. A tap does not drop it. The iPhone answers with a yellow disc.
4. Four red discs in a line, across, down or diagonally, win. The four are ringed, and Play again and Home appear.

PLAYING ON APPLE WATCH
The same game and the same gestures, with the Digital Crown as a second way to move the disc.

ALSO ON THE HOME SCREEN
Players switches to Two players, for two people taking turns on one device; the Difficulty setting is hidden in that mode. Difficulty (Easy, Medium, Hard) sets the opponent's strength, and Easy is built for beginners. Changing difficulty during a game asks before ending it. A game in progress is saved and resumes when Vier is opened again.

STORED DATA
On each device Vier keeps four preferences: the difficulty, the players setting, the saved game and who moves first next time. It sends nothing anywhere. Policy: https://excelano.com/legal/#vier. Code: https://github.com/excelano/vier.
"""

[locales."en-us"]
website = "https://github.com/excelano/vier"
support = "https://github.com/excelano/vier"
privacy = "https://excelano.com/legal/#vier"
description = """
Vier is the four-in-a-row board game for iPhone and Apple Watch. Red plays yellow on a seven-by-six board: drop discs in turn, and the first to line up four across, down or diagonally wins.

Slide a finger sideways to move your red disc over a column, then swipe down to drop it. A tap never drops a disc, so a stray touch can't spoil a game. The iPhone takes a moment to think, slides its yellow disc over and drops it in reply. The four discs that win the game are ringed and pulse.

The computer plays at three levels. Easy was built for beginners. Medium always blocks a win you are about to make. Hard reads four moves ahead. Who opens the game switches from one game to the next.

Two people can share one phone, too: choose Two players on the home screen and pass it back and forth across a table.

Vier comes with an Apple Watch app that plays the same game on your wrist, where the Digital Crown can move the disc as well. The watch plays without the iPhone nearby, and each device keeps its own game.

A game in progress survives a locked screen or a lowered wrist, and Vier reopens on the same board.

Vier works with no connection at all and holds no ads, sign-ups or purchases to tap into by accident, so it suits a child's iPhone or a watch under Family Setup. Anyone can read its code at github.com/excelano/vier.
"""

[locales."en-us".apple]
name = "Vier: Four in a Row"
subtitle = "Drop discs, beat the computer"
promotional-text = "Red against yellow on iPhone and Apple Watch. Beat the computer at Easy, Medium or Hard, or pass the phone across the table for a game between two people."
keywords = "board game,strategy,puzzle,family,classic,discs,offline,two player,watch game,kids,grid"
